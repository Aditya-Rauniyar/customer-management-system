<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">ClientFlow</title>
  <defs>
    <linearGradient id="brand" x1="90" y1="80" x2="410" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="people" x1="180" y1="190" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#080B2B"/>

  <!-- Open C-shaped flow mark -->
  <path d="M365 135
           A164 164 0 1 0 365 377"
        fill="none" stroke="url(#brand)" stroke-width="48"
        stroke-linecap="round"/>

  <!-- Central customer -->
  <circle cx="256" cy="205" r="34" fill="url(#people)"/>
  <path d="M190 330
           C190 282 219 252 256 252
           C293 252 322 282 322 330
           L322 344 L190 344 Z"
        fill="url(#people)"/>

  <!-- Supporting customers -->
  <circle cx="151" cy="239" r="25" fill="#A5B4FC"/>
  <path d="M108 326
           C108 290 127 268 153 268
           C169 268 181 276 190 289
           C178 304 171 323 170 344
           L108 344 Z"
        fill="#A5B4FC"/>

  <circle cx="361" cy="239" r="25" fill="#A5B4FC"/>
  <path d="M404 326
           C404 290 385 268 359 268
           C343 268 331 276 322 289
           C334 304 341 323 342 344
           L404 344 Z"
        fill="#A5B4FC"/>
</svg>
